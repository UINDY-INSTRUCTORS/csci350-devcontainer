name: Publish course image

# Builds the CSCI-350 toolchain image and pushes it to GHCR.
#
# linux/amd64 ONLY, and deliberately so. GitHub's standard runners are amd64,
# so adding linux/arm64 here would build it under QEMU — which reliably kills
# Racket CS at `raco pkg install` with:
#     Error: error reading from ~a  ("petite")   -> SIGABRT
# ("petite" is a Chez Scheme boot file; Chez and QEMU user-mode don't mix.)
#
# amd64 is what Codespaces runs, so this covers the deployment target.
# To add arm64 later, build it on a NATIVE arm64 runner and merge manifests —
# see "Adding arm64" in the README. Do not just add it to `platforms:`.
#
# WHY THIS IS MANUAL-ONLY
#
# It used to run on every push to main, with the image tag defaulting to
# 'fa26'. That tag is pinned by live assignment templates, so an ordinary
# merge republished the image students were mid-way through — three times
# (2026-09-03, -09-12, -09-13) before anyone noticed, the last of which moved
# :fa26 while a lab was open.
#
# Publishing is now a deliberate act: dispatch it, and name the tag yourself.
# There is no default, so the tag cannot be chosen by inattention.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (NOT fa26 — that is pinned by live templates)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/csci350

jobs:
  build:
    runs-on: ubuntu-latest        # native amd64
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,format=short

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every toolchain compiles/evaluates a real program. A published image
      # that can't run Racket should fail the build, not surprise a student.
      - name: Smoke test the published image
        run: |
          TAG=$(head -1 <<< "${{ steps.meta.outputs.tags }}")
          echo "Testing $TAG"
          docker run --rm "$TAG" smoke-test
