name: Publish course image

# Builds the CSCI-350 toolchain image and pushes it to GHCR.
#
# linux/amd64 ONLY, and deliberately so. GitHub's standard runners are amd64,
# so adding linux/arm64 here would build it under QEMU — which reliably kills
# Racket CS at `raco pkg install` with:
#     Error: error reading from ~a  ("petite")   -> SIGABRT
# ("petite" is a Chez Scheme boot file; Chez and QEMU user-mode don't mix.)
#
# amd64 is what Codespaces runs, so this covers the deployment target.
# To add arm64 later, build it on a NATIVE arm64 runner and merge manifests —
# see "Adding arm64" in the README. Do not just add it to `platforms:`.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. fa26)'
        required: true
        default: 'fa26'

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/csci350

jobs:
  build:
    runs-on: ubuntu-latest        # native amd64
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag || 'fa26' }}
            type=ref,event=tag
            type=sha,format=short

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every toolchain compiles/evaluates a real program. A published image
      # that can't run Racket should fail the build, not surprise a student.
      - name: Smoke test the published image
        run: |
          TAG=$(head -1 <<< "${{ steps.meta.outputs.tags }}")
          echo "Testing $TAG"
          docker run --rm "$TAG" smoke-test
