name: Publish course image (multi-arch)

# Publishes a linux/amd64 + linux/arm64 manifest list.
#
# WHY THIS IS SEPARATE FROM publish.yml
#
# publish.yml is the proven single-arch path that produced :fa26, the tag every
# live template pins. It stays exactly as it is. This workflow is manual-only
# and defaults to a DIFFERENT tag, so running it can never change the image
# under an assignment students are mid-way through.
#
# WHY A MATRIX AND NOT `platforms: linux/amd64,linux/arm64`
#
# Because that does not work here. GitHub's standard runners are amd64, so the
# arm64 leg would build under QEMU, and QEMU user-mode reliably kills Racket CS
# at `raco pkg install`:
#
#     Error: error reading from ~a  ("petite")   -> SIGABRT
#
# "petite" is a Chez Scheme boot file; Chez and QEMU do not mix. The fix is to
# build each architecture on a NATIVE runner, push each by digest, and merge the
# digests into one manifest list afterwards. ubuntu-24.04-arm is a real arm64
# runner and is free for public repositories, which this one is.
#
# The Dockerfile already handles both: TARGETARCH drives the Racket installer's
# x86_64/aarch64 naming and JAVA_HOME. Nothing in it needed changing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (NOT fa26 — that is pinned by live templates)'
        required: true
        default: 'fa26b'

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/csci350

jobs:
  build:
    strategy:
      fail-fast: false          # one arch failing should still leave the other inspectable
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects a mixed-case repository name, and github.repository_owner is
      # "UINDY-INSTRUCTORS". publish.yml never trips on this because
      # docker/metadata-action lowercases for you; pushing by digest bypasses
      # metadata-action, so it has to be done explicitly.
      - name: Lowercase the image reference
        id: img
        run: echo "ref=${REGISTRY}/${IMAGE,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE: ${{ env.IMAGE }}

      # Pushed by digest, with no tag. The merge job below assembles the tag
      # from both digests, so neither leg is ever briefly visible as the tag.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.img.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Runs natively on this runner's own architecture, so an arm64 image that
      # cannot actually start Racket fails here rather than in front of a class.
      - name: Smoke test this architecture
        run: |
          REF="${{ steps.img.outputs.ref }}@${{ steps.build.outputs.digest }}"
          echo "Testing $REF on $(uname -m)"
          docker run --rm "$REF" smoke-test

      # Filename is the digest with the "sha256:" prefix stripped; the merge job
      # puts it back. Strip it in bash, not in a ${{ }} expression — Actions
      # expressions have no parameter expansion.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects a mixed-case repository name, and github.repository_owner is
      # "UINDY-INSTRUCTORS". publish.yml never trips on this because
      # docker/metadata-action lowercases for you; pushing by digest bypasses
      # metadata-action, so it has to be done explicitly.
      - name: Lowercase the image reference
        id: img
        run: echo "ref=${REGISTRY}/${IMAGE,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE: ${{ env.IMAGE }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ steps.img.outputs.ref }}:${{ inputs.tag }}" \
            $(printf "${{ steps.img.outputs.ref }}@sha256:%s " *)

      - name: Show what was published
        run: |
          docker buildx imagetools inspect \
            "${{ steps.img.outputs.ref }}:${{ inputs.tag }}"
